name: W68 Printer Bridge CI

on:
  push:
    paths:
      - "printer_bridge/**"
      - ".github/workflows/printer-bridge-ci.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        working-directory: printer_bridge
        run: flutter pub get

      - name: Analyze
        working-directory: printer_bridge
        run: flutter analyze
