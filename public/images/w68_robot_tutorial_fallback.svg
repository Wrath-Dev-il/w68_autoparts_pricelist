<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
<title id="title">W68 Tutorial Robot</title>
<desc id="desc">Animated W68 robot mascot waving and blinking.</desc>
<style>
  .body-bob{transform-origin:180px 190px;animation:bob 2.4s ease-in-out infinite}
  .wave{transform-origin:277px 177px;animation:wave 1.05s ease-in-out infinite}
  .eye{transform-origin:center;animation:blink 3.2s ease-in-out infinite}
  .spark{animation:spark 1.2s ease-in-out infinite alternate}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes wave{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(18deg)}}
  @keyframes blink{0%,42%,48%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
  @keyframes spark{from{opacity:.25;transform:scale(.75)}to{opacity:1;transform:scale(1.15)}}
</style>
<g class="body-bob">
  <ellipse cx="180" cy="330" rx="92" ry="13" fill="#000" opacity=".16"/>
  <path d="M180 49v-22" stroke="#758387" stroke-width="8" stroke-linecap="round"/>
  <circle cx="180" cy="23" r="10" fill="#ffd633" stroke="#4b0719" stroke-width="4"/>
  <rect x="103" y="54" width="154" height="108" rx="28" fill="#e2e8ea" stroke="#758387" stroke-width="5"/>
  <rect x="118" y="68" width="124" height="79" rx="22" fill="#033b2e" stroke="#800020" stroke-width="4"/>
  <rect x="88" y="86" width="20" height="47" rx="8" fill="#800020" stroke="#4b0719" stroke-width="3"/>
  <rect x="252" y="86" width="20" height="47" rx="8" fill="#800020" stroke="#4b0719" stroke-width="3"/>
  <ellipse class="eye" cx="151" cy="106" rx="13" ry="10" fill="#ffd633"/>
  <ellipse class="eye" cx="209" cy="106" rx="13" ry="10" fill="#ffd633"/>
  <path d="M156 127c15 14 33 14 48 0" fill="none" stroke="#fff0a0" stroke-width="5" stroke-linecap="round"/>
  <rect x="161" y="155" width="38" height="25" rx="8" fill="#e2e8ea" stroke="#758387" stroke-width="4"/>
  <rect x="105" y="173" width="150" height="119" rx="30" fill="#800020" stroke="#4b0719" stroke-width="6"/>
  <rect x="126" y="194" width="108" height="70" rx="19" fill="#ffd633" stroke="#4b0719" stroke-width="4"/>
  <text x="180" y="242" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="900" fill="#800020">W68</text>
  <rect x="137" y="275" width="86" height="24" rx="10" fill="#064e3b" stroke="#033b2e" stroke-width="3"/>
  <text x="180" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="900" fill="#fff0a0" letter-spacing="1.6">GUIDE</text>
  <g>
    <path d="M106 203 72 227 53 265" fill="none" stroke="#758387" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M106 203 72 227 53 265" fill="none" stroke="#e2e8ea" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="53" cy="265" r="14" fill="#ffd633" stroke="#4b0719" stroke-width="4"/>
  </g>
  <g class="wave">
    <path d="M254 202 286 180 307 135" fill="none" stroke="#758387" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M254 202 286 180 307 135" fill="none" stroke="#e2e8ea" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="307" cy="135" r="14" fill="#ffd633" stroke="#4b0719" stroke-width="4"/>
    <path d="m304 125-7-17m12 16 1-19m5 22 10-15" stroke="#4b0719" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M150 294 139 327" stroke="#758387" stroke-width="24" stroke-linecap="round"/>
  <path d="M150 294 139 327" stroke="#e2e8ea" stroke-width="16" stroke-linecap="round"/>
  <path d="M210 294 221 327" stroke="#758387" stroke-width="24" stroke-linecap="round"/>
  <path d="M210 294 221 327" stroke="#e2e8ea" stroke-width="16" stroke-linecap="round"/>
  <rect x="116" y="319" width="48" height="22" rx="10" fill="#800020" stroke="#4b0719" stroke-width="4"/>
  <rect x="197" y="319" width="48" height="22" rx="10" fill="#800020" stroke="#4b0719" stroke-width="4"/>
  <circle class="spark" cx="328" cy="85" r="6" fill="#ffd633"/>
  <circle class="spark" cx="341" cy="109" r="4" fill="#ffd633" style="animation-delay:.25s"/>
  <circle class="spark" cx="312" cy="70" r="3" fill="#ffd633" style="animation-delay:.5s"/>
</g>
</svg>